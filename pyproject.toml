    "langchain-openai>=1.1.9",
    "langgraph>=1.0.8",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langgraph-cli[inmem]>=0.4.12",
    "langgraph-sdk>=0.3.5",
    "langgraph-supervisor>=0.0.31",
    "langsmith>=0.7.1",
    "mcp>=1.26.0",
    "notebook>=7.5.3",
    "openevals>=0.1.3",
    "pandas>=3.0.0",
    "python-dotenv>=1.2.1",
    "slack-sdk>=3.40.0",
    "tavily-python>=0.7.21",
    "wikipedia>=1.4.0",
